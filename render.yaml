# Blueprint de Render: https://render.com/docs/blueprint-spec
# Crear el Web Service y la base desde la UI con "New → Blueprint" apuntando al repo.

services:
  - type: web
    name: casitacalc-web
    runtime: node
    plan: free
    region: virginia
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm db:migrate && pnpm db:seed
    startCommand: pnpm --filter @casitacalc/web start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: casitacalc-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Auth.js: secreto para firmar sesiones (se genera solo en el primer deploy)
      - key: AUTH_SECRET
        generateValue: true
      # Credenciales de Google OAuth: cargarlas desde la UI de Render
      # (redirect URI autorizada: https://<app>.onrender.com/api/auth/callback/google)
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      # Allowlist de admins, ej: admin@casitacalc.com
      - key: ADMIN_EMAILS
        sync: false
      # URL pública para links de compartir
      - key: NEXT_PUBLIC_APP_URL
        sync: false

databases:
  - name: casitacalc-db
    plan: free
    region: virginia
    databaseName: casitacalc
    user: casitacalc
